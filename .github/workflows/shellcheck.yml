name: shellcheck

on:
  push:
    paths: ["provision.sh", "lib/**", ".shellcheckrc", ".github/workflows/shellcheck.yml"]
  pull_request:
    paths: ["provision.sh", "lib/**", ".shellcheckrc"]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -S error
        with:
          severity: error
          scandir: "."
          additional_files: "provision.sh"
          # dotfiles are zsh, not bash — skip them
          ignore_paths: "dotfiles"
